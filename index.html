<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Studienkollegs in Germany – Sommersemester 2027</title>
<style>
  :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; color: #e1e7ed; }
  #map { position: relative; width: 100%; height: 100%; background: radial-gradient(ellipse at 45% 45%, #151d29 0%, #0b0e14 75%); }
  svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.drag { cursor: grabbing; }
  .pin { cursor: pointer; }
  .halo { opacity: .25; transition: r .15s, opacity .15s; }
  .pin:hover .halo, .pin.sel .halo { r: 15; opacity: .4; }
  .lbl { font-size: 9.5px; fill: #c9d1d9; paint-order: stroke; stroke: #0b0e14; stroke-width: 3px; pointer-events: none; }
  .zoom { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e1e7ed; font-size: 18px; cursor: pointer; }
  .zoom button:hover { background: #21262d; }
  .hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #8b949e; background: #161b22cc; border: 1px solid #30363d; padding: 6px 12px; border-radius: 999px; pointer-events: none; transition: opacity .3s; }

  #panel { position: absolute; top: 14px; right: 14px; bottom: 14px; width: 390px; max-width: calc(100% - 28px); background: #161b22; border: 1px solid #30363d; border-radius: 14px; box-shadow: 0 12px 30px #0009; overflow-y: auto; padding: 20px; display: none; z-index: 10; }
  #panel.open { display: block; }
  .x { position: absolute; top: 10px; right: 14px; background: none; border: 0; color: #8b949e; font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: #fff; }
  h2 { font-size: 17px; color: #f0f6fc; margin-right: 26px; line-height: 1.3; }
  .sub { font-size: 12.5px; color: #8b949e; margin: 4px 0 12px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; margin: 0 6px 6px 0; border: 1px solid; }
  .grid { margin: 8px 0 4px; }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid #262c36; font-size: 12.5px; }
  .row span:first-child { color: #8b949e; flex-shrink: 0; }
  .row div { text-align: right; color: #f0f6fc; }
  .row small { display: block; color: #8b949e; font-size: 11px; margin-top: 2px; }
  h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #8b949e; margin: 18px 0 8px; }
  .course { background: #1c222b; border: 1px solid #2b323d; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .course b { color: #58a6ff; font-size: 13px; }
  .course p { font-size: 12px; color: #c9d1d9; margin-top: 3px; line-height: 1.45; }
  .note { font-size: 12px; color: #d29922; background: #d299221a; border: 1px solid #d2992244; border-radius: 8px; padding: 9px 11px; margin-top: 14px; line-height: 1.45; }
  .go { display: block; text-align: center; margin-top: 16px; padding: 10px; background: #238636; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .go:hover { background: #2ea043; }
  .fine { font-size: 11px; color: #6e7681; margin-top: 10px; line-height: 1.4; }

  @media (max-width: 760px) {
    #panel { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; max-width: none; max-height: 68%; }
    .zoom { bottom: auto; top: 14px; }
  }
</style>

const ST = {

const pins = document.getElementById("pins"), panel = document.getElementById("panel"), body = document.getElementById("body"), hint = document.getElementById("hint");
let cur = null;
D.forEach(d => {
  const [x, y] = proj(d.lon, d.lat), col = ST[d.st].c;
  const g = document.createElementNS(NS, "g"); g.setAttribute("class", "pin");
  g.innerHTML = '<circle class="halo" cx="' + x + '" cy="' + y + '" r="11" fill="' + col + '"/><circle cx="' + x + '" cy="' + y + '" r="6.5" fill="' + col + '" stroke="#fff" stroke-width="1.6"/><text class="lbl" x="' + (x + 11) + '" y="' + (y + 3.5) + '">' + d.city + '</text>';
  g.addEventListener("click", e => { e.stopPropagation(); show(d, g); });
  d.el = g; pins.appendChild(g);
});

function show(d, g) {
  if (cur) cur.classList.remove("sel");
  cur = g; g.classList.add("sel"); hint.style.opacity = 0;
  const s = ST[d.st], lc = d.ok ? "#3fb950" : "#f0883e";
  const chip = (t, c) => '<span class="chip" style="color:' + c + ';border-color:' + c + '66;background:' + c + '1a">' + t + '</span>';
  const row = (a, b, sm) => '<div class="row"><span>' + a + '</span><div>' + b + (sm ? '<small>' + sm + '</small>' : '') + '</div></div>';
  body.innerHTML =
    '<h2>' + d.n + '</h2><div class="sub">' + d.addr + '</div>' +
    chip(s.t, s.c) + chip(d.lang, lc) +
    '<div class="grid">' + row("Intake", d.start) + row("Apply", d.apply) + row("Deadline", d.dl, d.dlSrc ? "Source: " + d.dlSrc : "") + row("Entrance exam", d.exam, d.examSrc ? "Source: " + d.examSrc : "") + '</div>' +
    '<h3>Courses offered</h3>' +
    d.courses.map(c => '<div class="course"><b>' + c[0] + '-Kurs · ' + c[1] + '</b><p>' + c[2] + '</p></div>').join("") +
    '<div class="note">' + d.note + '</div>' +
    '<a class="go" href="' + d.url + '" target="_blank" rel="noopener">' + d.link + ' →</a>' +
    '<p class="fine">Dates change between semesters – always confirm on the official page before you apply.</p>';
  panel.classList.add("open"); panel.scrollTop = 0;
}
function closeP() { panel.classList.remove("open"); if (cur) cur.classList.remove("sel"); cur = null; }
document.getElementById("close").onclick = closeP;
window.addEventListener("keydown", e => { if (e.key === "Escape") closeP(); });

// pan & zoom
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
let k = 1, tx = 0, ty = 0, drag = null, moved = false;
const apply = () => vp.setAttribute("transform", "translate(" + tx + " " + ty + ") scale(" + k + ")");
const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
function zoomAt(f, cx, cy) { const nk = Math.min(6, Math.max(1, k * f)), r = nk / k; tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; k = nk; if (k === 1) { tx = 0; ty = 0; } apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const p = pt(e); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, p.x, p.y); }, { passive: false });
svg.addEventListener("pointerdown", e => { drag = { p: pt(e), tx, ty }; moved = false; });
window.addEventListener("pointermove", e => { if (!drag) return; const p = pt(e); const dx = p.x - drag.p.x, dy = p.y - drag.p.y; if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; svg.classList.add("drag"); } tx = drag.tx + dx; ty = drag.ty + dy; apply(); });
window.addEventListener("pointerup", () => { drag = null; svg.classList.remove("drag"); });
svg.addEventListener("click", () => { if (!moved) closeP(); });
document.getElementById("zi").onclick = () => zoomAt(1.4, 260, 340);
document.getElementById("zo").onclick = () => zoomAt(1 / 1.4, 260, 340);
document.getElementById("zr").onclick = () => { k = 1; tx = 0; ty = 0; apply(); };
